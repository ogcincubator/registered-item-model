$schema: https://json-schema.org/draft/2020-12/schema
title: ISO 19135 Register Item Class
description: >-
  The abstraction a set of register items share; the unit data requirements and validation rules
  attach to (ISO 19135:2026). `type` is not pinned so that a sub-register may use its own term.
type: object
required: [id, type, title]
properties:
  id: {type: string, format: uri}
  type:
    oneOf:
      - type: string
      - {type: array, minItems: 1, items: {type: string}}
  objectIdentifier: {type: string, format: uri}
  functionalIdentifier: {type: string, format: uri}
  title: {type: string}
  description: {type: string}
  definedIn:
    description: The register that defines this item class (an IRI or an embedded rim:Register node).
    $ref: '#/$defs/ref'
  validatedBy:
    description: The executable rule set (e.g. a SHACL shape) expressing this class's data requirements.
    oneOf:
      - {type: string, format: uri}
      - {type: array, items: {type: string, format: uri}}
additionalProperties: true
$defs:
  ref:
    oneOf:
      - {type: string, format: uri}
      - {type: object, required: [id], properties: {id: {type: string, format: uri}}}
