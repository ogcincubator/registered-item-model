$schema: https://json-schema.org/draft/2020-12/schema
title: ISO 19135 Register Specification
description: >-
  The document stating a register's purpose, scope, roles, processes, rules and commitments
  (ISO 19135:2026). `type` is not pinned so that a sub-register may use its own term.
type: object
required: [id, type, title]
properties:
  id: {type: string, format: uri}
  type:
    oneOf:
      - type: string
      - {type: array, minItems: 1, items: {type: string}}
  title: {type: string}
  description: {type: string}
  definesSubstantiveChange:
    description: What counts as a substantive (not merely clarifying) change for this register.
    type: string
  hasCommitment:
    type: array
    items:
      type: object
      required: [commitmentCategory, description]
      properties:
        id: {type: string, format: uri}
        type: {const: Commitment}
        commitmentCategory: {enum: [access, persistence, transparency]}
        description: {type: string}
additionalProperties: true
